<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Chip&amp;Chapa</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/x-icon" href="/Imagenes/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles/site.css">
    <script>
        // Si la ruta es una sección (/proyectos, /servicios...), vuelve al inicio y hace scroll ahí.
        (function () {
            var secciones = ["inicio", "servicios", "proyectos", "metodo", "equipo", "contacto"];
            var partes = location.pathname.split("/").filter(Boolean);
            var ultima = (partes[partes.length - 1] || "").toLowerCase();
            if (secciones.indexOf(ultima) !== -1) {
                try { sessionStorage.setItem("chipScroll", ultima); } catch (e) {}
                location.replace("/");
            }
        })();
    </script>
</head>
<body class="bg-cc-dark text-white d-flex align-items-center justify-content-center text-center min-vh-100">
    <main class="container py-5">
        <img src="/Imagenes/Mascota/mascota-blanca.png" alt="Mascota de Chip&amp;Chapa" width="220" height="220" class="mb-4">
        <h1 class="display-4 fw-bold">Error <span class="text-cc-blue">404</span></h1>
        <p class="lead text-white-50 mb-4">Esta página no existe o cambió de lugar.</p>
        <a href="/" class="btn btn-cc btn-lg">Volver al inicio</a>
    </main>
</body>
</html>
